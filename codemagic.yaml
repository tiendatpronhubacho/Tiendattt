workflows:
  xtool-build:
    name: Build xtool IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install xtool
        script: |
          set -e
          brew install xtool-org/tap/xtool
      - name: Build
        script: |
          set -e
          echo "=== Danh sach file o thu muc goc ==="
          ls -la
          PKG=$(find . -name Package.swift -not -path "*/.build/*" | head -n 1)
          if [ -z "$PKG" ]; then
            echo "LOI: Khong tim thay Package.swift trong repo"
            exit 1
          fi
          cd "$(dirname "$PKG")"
          echo "=== Dang build tai: $(pwd) ==="
          xtool dev build --ipa
    artifacts:
      - "**/xtool/*.ipa"
      - "**/*.ipa"
